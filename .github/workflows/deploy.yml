name: Deploy Jalwa Video Call Server

on:
  push:
    branches: [deployment-prod]
  workflow_dispatch:

env:
  NODE_VERSION: '18'
  APP_DIR: /var/www/jalwa-video-call-app
  PM2_APP_NAME: jalwa-server

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Deploy to VPS
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        key: ${{ secrets.VPS_SSH_KEY }}
        port: ${{ secrets.VPS_PORT }}
        script: |
          set -e

          echo "=== Deploying Jalwa Video Call Server ==="

          cd /var/www/jalwa-video-call-app

          echo "--- Pulling latest changes ---"
          git fetch origin deployment-prod
          git reset --hard origin/deployment-prod

          echo "--- Installing dependencies ---"
          pnpm install --frozen-lockfile || pnpm install

          echo "--- Running Prisma generate & migrations ---"
          npx prisma generate
          npx prisma migrate deploy

          echo "--- Ensuring required directories exist ---"
          mkdir -p logs uploads

          echo "--- Restarting application ---"
          if pm2 describe jalwa-server > /dev/null 2>&1; then
            pm2 restart jalwa-server --update-env
          else
            pm2 start ecosystem.config.js --env production
          fi
          pm2 save

          echo "--- Health check ---"
          sleep 5
          for i in 1 2 3 4 5; do
            if curl -f -s -m 10 http://localhost:4000/health; then
              echo ""
              echo "Health check passed on attempt $i"
              break
            else
              echo "Health check attempt $i failed, waiting 5s..."
              sleep 5
              if [ "$i" = "5" ]; then
                echo "Health check failed after 5 attempts"
                pm2 logs jalwa-server --lines 30 --nostream
                exit 1
              fi
            fi
          done

          echo ""
          echo "=== Deployment complete ==="
          pm2 list

    - name: Deployment status
      if: always()
      run: |
        if [ "${{ job.status }}" == "success" ]; then
          echo "Deployment successful - Jalwa server is live at 72.61.225.146:4000"
        else
          echo "Deployment failed - check logs above"
        fi
